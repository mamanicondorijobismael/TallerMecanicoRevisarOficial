<body class="bg-background text-on-background h-screen flex">
<!-- Left Side: Branding / Background -->
<div class="hidden lg:flex w-1/2 bg-primary-container flex-col justify-between p-xl relative overflow-hidden">
<div class="relative z-10 flex flex-col gap-xs">
<h1 class="font-display-lg text-display-lg font-black text-tertiary-fixed-dim">TAMGO</h1>
<p class="font-headline-sm text-headline-sm text-on-primary">Workshop Management</p>
</div>
<div class="relative z-10">
<p class="font-display-md text-display-md text-on-primary max-w-md">
                Precision, durability, and clarity for high-stakes mechanical service environments.
            </p>
</div>
<!-- Decorative background elements to simulate industrial tech feel -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 100% 100%, #f9bd14 0%, transparent 50%);"></div>
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #ffffff 10px, #ffffff 11px);"></div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-lg sm:p-xl bg-surface-container-lowest relative">
<div class="w-full max-w-md flex flex-col gap-xl relative z-10">
<div class="flex flex-col gap-sm text-center lg:text-left">
<!-- Mobile Logo -->
<div class="lg:hidden mb-sm">
<h1 class="font-display-lg text-display-lg font-black text-primary-container">TAMGO</h1>
</div>
<h2 class="font-display-md text-display-md text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue to your dashboard.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Username / Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Username or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all font-body-md text-body-md bg-transparent outline-none" id="email" placeholder="Enter your username" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-10 pr-10 py-2 border border-outline-variant rounded focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all font-body-md text-body-md bg-transparent outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-outline-variant text-tertiary-fixed-dim focus:ring-tertiary-fixed-dim bg-transparent cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<!-- Login Button -->
<button class="w-full mt-lg bg-tertiary-fixed-dim hover:bg-[#e0a804] text-on-tertiary-fixed font-label-bold text-label-bold py-3 rounded shadow-sm hover:shadow transition-all duration-200" type="submit">
                    Login
                </button>
</form>
<div class="text-center mt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Need help? Contact <a class="text-secondary font-medium hover:underline" href="#">IT Support</a>
</p>
</div>
</div>
</div>
<script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });
    </script>
