{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block subtitle %}Agendar cita o turno{% endblock %}

{% block back_button %}
<a href="{% url 'reservas:lista' %}" class="btn-back">
  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
  Reservas
</a>
{% endblock %}

{% block content %}
<!-- Modal pre-abierto -->
<div id="modal-reserva-form" class="modal-overlay open" data-backdrop-redirect="{% url 'reservas:lista' %}">
  <div class="modal-box modal-sm">
    <div class="modal-header">
      <div class="modal-title">{{ title }}</div>
      <a href="{% url 'reservas:lista' %}" class="modal-close">✕</a>
    </div>
    <form method="POST">
      {% csrf_token %}
      <div class="modal-body space-y-4">
        {{ form.as_p }}
      </div>
      <div class="modal-footer">
        <a href="{% url 'reservas:lista' %}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar Reserva</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
